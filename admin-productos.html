<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Admin | Productos</title>
    <link rel="stylesheet" href="css\admin.css">
</head>
<body>
    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="admin-home.html">Dashboard</a></li>
            <li><a href="admin-productos.html">Productos</a></li>
            <li><a href="admin-usuarios.html">Usuarios</a></li>
        </ul>
    </aside>
    <main class="main-content">
        <h1>Gestión de Productos</h1>
        <div style="background:white; padding:20px; margin-bottom:20px; border-radius:10px">
            <h3>Nuevo Producto</h3>
            <form id="prodForm" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <input type="text" placeholder="Código" required>
                <input type="text" placeholder="Nombre" required>
                <input type="number" placeholder="Precio" required>
                <input type="number" placeholder="Stock" required>
                <select><option>Electrónica</option><option>Computación</option></select>
                <button type="submit" class="btn">Guardar Producto</button>
            </form>
        </div>
        <table class="admin-table">
            <thead><tr><th>Cód</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
            <tbody>
                <tr><td>P001</td><td>Laptop Gamer</td><td>$1.200.000</td><td>10</td><td><button>Editar</button></td></tr>
                <tr><td>P002</td><td>Smartphone</td><td>$600.000</td><td>5</td><td><button>Editar</button></td></tr>
            </tbody>
        </table>
    </main>
</body>
</html>
