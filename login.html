<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Login | TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header><h1>TechStore</h1><nav><ul><li><a href="index.html">Home</a></li></ul></nav></header>
    <div class="form-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group"><label>Correo</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="pass" required></div>
            <button type="submit" class="btn">Entrar</button>
        </form>
    </div>
    <script src="js/validations.js"></script>
    <script>
        document.getElementById('loginForm').onsubmit = (e) => {
            const email = document.getElementById('email').value;
            if(!validateEmail(email)) {
                e.preventDefault();
                alert("Correo no válido. Solo @duoc.cl, @profesor.duoc.cl o @gmail.com");
            } else {
                window.location.href = "admin-home.html";
            }
        };
    </script>
</body>
</html>
