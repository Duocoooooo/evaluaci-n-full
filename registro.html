<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Registro | TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header><h1>TechStore</h1><nav><ul><li><a href="index.html">Home</a></li></ul></nav></header>
    <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form id="regForm">
            <div class="form-group"><label>Nombre Completo</label><input type="text" id="name" required></div>
            <div class="form-group"><label>Correo</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="pass" required></div>
            <div class="form-group"><label>Confirmar Contraseña</label><input type="password" id="pass2" required></div>
            <div class="form-group">
                <label>Región</label><select id="region"></select>
            </div>
            <div class="form-group">
                <label>Comuna</label><select id="comuna"></select>
            </div>
            <button type="submit" class="btn">Registrar</button>
        </form>
    </div>
    <script src="js/validations.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
